<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArduinoGo — Aprenda C++ de Robótica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --primary: #238636;
      --primary-hover: #2ea043;
      --secondary: #38bdf8;
      --accent: #f59e0b;
      --danger: #da3633;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --code-bg: #010409;
      --block-bg: #21262d;
      --block-active: #1f6beb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Header Bar */
    header {
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--code-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* Bottom Navigation Bar */
    .nav-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 40;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .tab-btn.active { color: var(--secondary); }
    .tab-btn span { font-size: 1.3rem; }

    /* Path & Sections */
    .section-box { margin-bottom: 24px; }
    .section-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .section-title { font-size: 1.1rem; font-weight: 800; color: var(--secondary); margin-bottom: 4px; }
    .section-desc { font-size: 0.85rem; color: var(--text-muted); }

    .lessons-list { display: flex; flex-direction: column; gap: 10px; }
    .lesson-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lesson-card.unlocked { cursor: pointer; border-color: var(--primary); }
    .lesson-card.completed { border-color: var(--secondary); background: rgba(56, 189, 248, 0.08); }
    .lesson-card.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

    .lesson-info { display: flex; align-items: center; gap: 12px; }
    .lesson-icon { font-size: 1.4rem; }
    .lesson-title { font-weight: 700; font-size: 0.95rem; }

    /* Interactive Lesson Modal (Estilo Mimo Slide por Slide) */
    .lesson-modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .lesson-modal.active { display: flex; }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .progress-bar-bg { flex: 1; height: 10px; background: var(--card-bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--card-border); }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

    /* Slide Types */
    .slide-container { flex: 1; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }

    .slide-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--secondary);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      width: fit-content;
      text-transform: uppercase;
    }

    .slide-title { font-size: 1.25rem; font-weight: 800; line-height: 1.3; }
    .slide-text { font-size: 0.95rem; color: var(--text); line-height: 1.6; }

    .code-box {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    /* Mimo Style Block Construction & Inputs */
    .answer-zone {
      min-height: 52px;
      background: var(--code-bg);
      border: 2px dashed var(--card-border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .blocks-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .code-block-btn {
      background: var(--block-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--card-border);
    }
    .code-block-btn:active { transform: translateY(2px); box-shadow: none; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
    }
    .option-btn.selected { border-color: var(--secondary); background: rgba(56, 189, 248, 0.15); }

    /* Bottom Sheet Feedback */
    .feedback-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.25s ease;
      z-index: 110;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .feedback-sheet.correct { background: #0d381e; border-top: 3px solid var(--primary); display: flex; }
    .feedback-sheet.wrong { background: #4a151b; border-top: 3px solid var(--danger); display: flex; }

    .feedback-title { font-weight: 800; font-size: 1.15rem; }
    .feedback-text { font-size: 0.9rem; opacity: 0.95; line-height: 1.4; }

    .btn-action {
      background: white;
      color: black;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .btn-start {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #1b6629;
      width: 100%;
      text-transform: uppercase;
      margin-top: auto;
    }

    .badges-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .badge-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.4;
      filter: grayscale(1);
    }
    .badge-card.unlocked { opacity: 1; filter: grayscale(0); border-color: var(--accent); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🤖 ArduinoGo</div>
    <div class="stats-bar">
      <div class="stat-item">⚡ <span id="user-xp">0</span> XP</div>
      <div class="stat-item">🔥 <span id="user-streak">1</span>d</div>
      <div class="stat-item">❤️ <span id="user-hearts">5</span></div>
    </div>
  </header>

  <main>
    <div id="view-path">
      <div id="sections-container"></div>
    </div>

    <div id="view-infinite" class="hidden">
      <div class="section-header">
        <div class="section-title">♾️ Treino Infinito</div>
        <div class="section-desc">Pratique com questões aleatórias estilo Mimo!</div>
      </div>
      <button class="btn-start" onclick="startInfinitePractice()">Iniciar Treino 🚀</button>
    </div>

    <div id="view-badges" class="hidden">
      <div class="section-header">
        <div class="section-title">🏆 Conquistas</div>
      </div>
      <div class="badges-grid" id="badges-container"></div>
    </div>
  </main>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('path', this)">
      <span>🗺️</span>Trilha
    </button>
    <button class="tab-btn" onclick="switchTab('infinite', this)">
      <span>♾️</span>Infinito
    </button>
    <button class="tab-btn" onclick="switchTab('badges', this)">
      <span>🏆</span>Conquistas
    </button>
  </nav>

  <div class="lesson-modal" id="lesson-modal">
    <div class="modal-header">
      <button class="close-btn" onclick="closeLessonModal()">✕</button>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="slide-progress"></div>
      </div>
      <div>❤️ <span id="modal-hearts">5</span></div>
    </div>

    <div class="slide-container" id="slide-container"></div>

    <button class="btn-start" id="btn-check" onclick="checkSlideAnswer()">Continuar</button>

    <div class="feedback-sheet" id="feedback-sheet">
      <div class="feedback-title" id="fb-title"></div>
      <div class="feedback-text" id="fb-text"></div>
      <button class="btn-action" onclick="advanceSlide()">Continuar ▶</button>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let state = {
      xp: 0,
      streak: 1,
      hearts: 5,
      completedLessons: [],
      unlockedBadges: ['b1']
    };

    let raw = localStorage.getItem('arduinoGoState');
    if (raw) {
      try {
        let p = JSON.parse(raw);
        state.xp = p.xp || 0;
        state.streak = p.streak || 1;
        state.hearts = (typeof p.hearts === 'number' && p.hearts > 0) ? p.hearts : 5;
        state.completedLessons = p.completedLessons || [];
        state.unlockedBadges = p.unlockedBadges || ['b1'];
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem('arduinoGoState', JSON.stringify(state));
      updateUI();
    }

    function updateUI() {
      document.getElementById('user-xp').innerText = state.xp;
      document.getElementById('user-streak').innerText = state.streak;
      document.getElementById('user-hearts').innerText = state.hearts;
      document.getElementById('modal-hearts').innerText = state.hearts;
      renderPath();
      renderBadges();
    }

    // --- AUDIO SYNTHESIZER ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // --- CURRÍCULO INTERATIVO SLIDE POR SLIDE (ESTILO MIMO) ---
    const sections = [
      {
        id: 's1',
        title: 'Sessão 1: Variáveis & Pinos do Robô',
        desc: 'Aprenda guardando informações e ativando pinos.',
        lessons: [
          {
            id: 's1_l1',
            title: 'Lição 1: O Que É Uma Variável?',
            icon: '📦',
            slides: [
              {
                type: 'info',
                badge: 'Conceito',
                title: 'Caixas de Memória',
                text: 'Uma variável é como uma caixa com um nome onde guardamos um dado. No C++ do Arduino, para criar uma caixa de números inteiros usamos a palavra int.',
                code: 'int pinoLed = 13;'
              },
              {
                type: 'quiz',
                badge: 'Verificação',
                title: 'Qual palavra-chave usase para criar uma variável de número inteiro?',
                options: ['int', 'box', 'number', 'var'],
                correct: 0,
                explanation: 'Em C++, a palavra "int" cria uma variável para números inteiros (sem casas decimais).'
              },
              {
                type: 'blocks',
                badge: 'Montar Código',
                title: 'Conecte os blocos para criar a variável pinoLed igual a 13:',
                available: ['13;', '=', 'int', 'pinoLed'],
                correctOrder: ['int', 'pinoLed', '=', '13;'],
                explanation: 'A ordem correta é: tipo (int) + nome (pinoLed) + sinal (=) + valor e ponto-e-vírgula (13;).'
              },
              {
                type: 'quiz',
                badge: 'Sintaxe',
                title: 'Qual regra de nome de variável está correta no estilo snake_case?',
                options: ['led vermelho', 'led_vermelho', 'led-vermelho', 'led.vermelho'],
                correct: 1,
                explanation: 'Nomes de variáveis não podem ter espaços. Usamos o traço baixo (_) para separar palavras.'
              }
            ]
          },
          {
            id: 's1_l2',
            title: 'Lição 2: Configurando o pinMode()',
            icon: '🔌',
            slides: [
              {
                type: 'info',
                badge: 'Entrada e Saída',
                title: 'Avisando a Placa',
                text: 'O comando pinMode() avisa se o pino vai enviar energia (OUTPUT) para um LED/motor ou receber dados (INPUT) de um sensor.',
                code: 'pinMode(13, OUTPUT);'
              },
              {
                type: 'blocks',
                badge: 'Montar Código',
                title: 'Monte o comando para configurar o pino 13 como SAÍDA:',
                available: ['OUTPUT);', '13,', 'pinMode(', 'digitalWrite('],
                correctOrder: ['pinMode(', '13,', 'OUTPUT);'],
                explanation: 'Usamos pinMode(pino, OUTPUT); para definir portas de saída de energia.'
              },
              {
                type: 'quiz',
                badge: 'Quiz Rápido',
                title: 'Em qual das duas funções obrigatórias colocamos o pinMode()?',
                options: ['setup()', 'loop()'],
                correct: 0,
                explanation: 'Como o pino só precisa ser configurado 1 única vez quando o robô liga, colocamos no setup().'
              }
            ]
          },
          {
            id: 's1_l3',
            title: 'Lição 3: Ligando com digitalWrite()',
            icon: '💡',
            slides: [
              {
                type: 'info',
                badge: 'Ativando Energia',
                text: 'Para ligar um LED mandando 5V de energia, usamos digitalWrite com o valor HIGH. Para desligar (0V), usamos LOW.',
                code: 'digitalWrite(13, HIGH); // Liga o LED\ndigitalWrite(13, LOW);  // Desliga o LED'
              },
              {
                type: 'quiz',
                badge: 'Verificação',
                title: 'Qual valor envia 5V para LIGAR um componente?',
                options: ['HIGH', 'LOW', 'ON', 'START'],
                correct: 0,
                explanation: 'HIGH envia 5 Volt (liga), enquanto LOW corta a voltagem para 0V (desliga).'
              },
              {
                type: 'blocks',
                badge: 'Prática de Código',
                title: 'Monte a linha de código para LIGAR o pino 13:',
                available: ['HIGH);', '13,', 'digitalWrite(', 'LOW);'],
                correctOrder: ['digitalWrite(', '13,', 'HIGH);'],
                explanation: 'digitalWrite(13, HIGH); envia o sinal elétrico para acender o componente no pino 13.'
              }
            ]
          },
          {
            id: 's1_l4',
            title: 'Lição 4: Pausando com delay()',
            icon: '⏱️',
            slides: [
              {
                type: 'info',
                badge: 'Tempo de Espera',
                text: 'O comando delay() faz o robô pausar antes da próxima linha de código. O tempo é medido em milissegundos (1000ms = 1 segundo).',
                code: 'delay(1000); // Pausa por 1 segundo'
              },
              {
                type: 'quiz',
                badge: 'Cálculo Rápido',
                title: 'Quanto tempo o comando delay(500) faz o robô esperar?',
                options: ['Meio segundo (0.5s)', '5 segundos', '50 segundos', '5 milissegundos'],
                correct: 0,
                explanation: '500 milissegundos equivalem a meio segundo de pausa.'
              },
              {
                type: 'blocks',
                badge: 'Prática de Código',
                title: 'Monte o comando para pausar por 2 segundos exatos (2000ms):',
                available: ['2000);', 'delay(', 'wait(', '2);'],
                correctOrder: ['delay(', '2000);'],
                explanation: 'delay(2000); faz o robô congelar as ações por 2000 milissegundos (2 segundos).'
              }
            ]
          },
          {
            id: 's1_l5',
            title: 'Lição 5: Posicionando o Servo Motor',
            icon: '⚙️',
            slides: [
              {
                type: 'info',
                badge: 'Animatrônicos',
                text: 'Para mover o motor da boca ou dos olhos do robô para um ângulo exato entre 0° e 180°, usamos o comando write() do servo.',
                code: 'meuServo.write(90); // Roda para o meio (90 graus)'
              },
              {
                type: 'blocks',
                badge: 'Montar Código',
                title: 'Monte o comando para mover o servo para os 90 graus:',
                available: ['write(90);', 'meuServo.', 'rotate(90);', 'move('],
                correctOrder: ['meuServo.', 'write(90);'],
                explanation: 'meuServo.write(90); posiciona o eixo do motor exatamente na posição de 90 graus.'
              }
            ]
          }
        ]
      }
    ];

    // --- ENGINE DE NAVEGAÇÃO DOS SLIDES DA LIÇÃO ---
    let currentLesson = null;
    let currentSlideIdx = 0;
    let selectedOptionIdx = null;
    let userPlacedBlocks = [];

    function renderPath() {
      const container = document.getElementById('sections-container');
      if (!container) return;
      container.innerHTML = '';

      sections.forEach((sec) => {
        const secBox = document.createElement('div');
        secBox.className = 'section-box';

        let lessonsHTML = '';
        let prevDone = true;

        sec.lessons.forEach((les) => {
          const isDone = state.completedLessons.includes(les.id);
          const isUnlocked = isDone || prevDone;

          let cardClass = 'locked';
          let icon = '🔒';

          if (isDone) { cardClass = 'completed'; icon = '✅'; }
          else if (isUnlocked) { cardClass = 'unlocked'; icon = '▶'; }

          const action = isUnlocked ? `onclick="startLesson('${sec.id}', '${les.id}')"` : '';

          lessonsHTML += `
            <div class="lesson-card ${cardClass}" ${action}>
              <div class="lesson-info">
                <span class="lesson-icon">${les.icon}</span>
                <span class="lesson-title">${les.title}</span>
              </div>
              <span class="lesson-status">${icon}</span>
            </div>
          `;
          prevDone = isDone;
        });

        secBox.innerHTML = `
          <div class="section-header">
            <div class="section-title">📍 ${sec.title}</div>
            <div class="section-desc">${sec.desc}</div>
          </div>
          <div class="lessons-list">${lessonsHTML}</div>
        `;
        container.appendChild(secBox);
      });
    }

    function startLesson(secId, lesId) {
      const sec = sections.find(s => s.id === secId);
      if (!sec) return;
      const les = sec.lessons.find(l => l.id === lesId);
      if (!les) return;

      currentLesson = les;
      currentSlideIdx = 0;
      document.getElementById('lesson-modal').classList.add('active');
      showSlide();
    }

    function showSlide() {
      const slide = currentLesson.slides[currentSlideIdx];
      selectedOptionIdx = null;
      userPlacedBlocks = [];
      document.getElementById('feedback-sheet').className = 'feedback-sheet';

      const pct = (currentSlideIdx / currentLesson.slides.length) * 100;
      document.getElementById('slide-progress').style.width = pct + '%';

      const container = document.getElementById('slide-container');
      container.innerHTML = '';

      const btnCheck = document.getElementById('btn-check');

      if (slide.type === 'info') {
        btnCheck.innerText = 'Continuar';
        container.innerHTML = `
          <div class="slide-badge">📖 ${slide.badge}</div>
          <div class="slide-title">${slide.title}</div>
          <div class="slide-text">${slide.text}</div>
          ${slide.code ? `<div class="code-box">${slide.code}</div>` : ''}
        `;
      } else if (slide.type === 'quiz') {
        btnCheck.innerText = 'Verificar';
        let optionsHTML = slide.options.map((opt, idx) => `
          <button class="option-btn" onclick="selectQuizOption(${idx}, this)">${opt}</button>
        `).join('');

        container.innerHTML = `
          <div class="slide-badge">❓ ${slide.badge}</div>
          <div class="slide-title">${slide.title}</div>
          <div class="options-grid">${optionsHTML}</div>
        `;
      } else if (slide.type === 'blocks') {
        btnCheck.innerText = 'Verificar';
        container.innerHTML = `
          <div class="slide-badge">🧩 ${slide.badge}</div>
          <div class="slide-title">${slide.title}</div>
          <div class="answer-zone" id="answer-zone"></div>
          <div class="blocks-palette" id="blocks-palette"></div>
        `;
        renderBlockPalette(slide.available);
      }
    }

    function selectQuizOption(idx, btnElem) {
      selectedOptionIdx = idx;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btnElem.classList.add('selected');
    }

    function renderBlockPalette(available) {
      const palette = document.getElementById('blocks-palette');
      if (!palette) return;
      palette.innerHTML = '';

      available.forEach((text) => {
        if (!userPlacedBlocks.includes(text)) {
          const btn = document.createElement('button');
          btn.className = 'code-block-btn';
          btn.innerText = text;
          btn.onclick = () => addBlock(text);
          palette.appendChild(btn);
        }
      });
      renderAnswerZone();
    }

    function addBlock(text) {
      userPlacedBlocks.push(text);
      const slide = currentLesson.slides[currentSlideIdx];
      renderBlockPalette(slide.available);
    }

    function removeBlock(idx) {
      userPlacedBlocks.splice(idx, 1);
      const slide = currentLesson.slides[currentSlideIdx];
      renderBlockPalette(slide.available);
    }

    function renderAnswerZone() {
      const zone = document.getElementById('answer-zone');
      if (!zone) return;
      zone.innerHTML = '';

      userPlacedBlocks.forEach((text, idx) => {
        const btn = document.createElement('button');
        btn.className = 'code-block-btn';
        btn.style.borderColor = 'var(--secondary)';
        btn.innerText = text;
        btn.onclick = () => removeBlock(idx);
        zone.appendChild(btn);
      });
    }

    function checkSlideAnswer() {
      const slide = currentLesson.slides[currentSlideIdx];
      const sheet = document.getElementById('feedback-sheet');

      if (slide.type === 'info') {
        advanceSlide();
        return;
      }

      let isCorrect = false;

      if (slide.type === 'quiz') {
        if (selectedOptionIdx === null) return;
        isCorrect = selectedOptionIdx === slide.correct;
      } else if (slide.type === 'blocks') {
        if (userPlacedBlocks.length !== slide.correctOrder.length) {
          isCorrect = false;
        } else {
          isCorrect = userPlacedBlocks.every((val, i) => val === slide.correctOrder[i]);
        }
      }

      if (isCorrect) {
        playSound('correct');
        sheet.className = 'feedback-sheet correct';
        document.getElementById('fb-title').innerText = '🎉 Excelente!';
        document.getElementById('fb-text').innerText = slide.explanation || 'Você acertou!';
        state.xp += 10;
      } else {
        playSound('wrong');
        sheet.className = 'feedback-sheet wrong';
        document.getElementById('fb-title').innerText = '❌ Ops, quase lá!';
        document.getElementById('fb-text').innerText = slide.explanation || 'Tente organizar os elementos novamente!';
        state.hearts = Math.max(0, state.hearts - 1);
      }
      saveState();
    }

    function advanceSlide() {
      currentSlideIdx++;
      document.getElementById('feedback-sheet').className = 'feedback-sheet';

      if (currentSlideIdx < currentLesson.slides.length && state.hearts > 0) {
        showSlide();
      } else {
        if (state.hearts > 0) {
          if (!state.completedLessons.includes(currentLesson.id)) {
            state.completedLessons.push(currentLesson.id);
          }
          saveState();
          alert('🏁 Lição concluída com sucesso! +10 XP 🎉');
        } else {
          state.hearts = 5;
          saveState();
          alert('💔 Vidas zeradas! Recarregamos seus 5 corações para continuar.');
        }
        closeLessonModal();
      }
    }

    function closeLessonModal() {
      document.getElementById('lesson-modal').classList.remove('active');
      document.getElementById('feedback-sheet').className = 'feedback-sheet';
    }

    function startInfinitePractice() {
      currentLesson = {
        id: 'inf',
        slides: [
          {
            type: 'quiz',
            badge: 'Treino',
            title: 'Qual comando configura o pino 9 como saída de energia?',
            options: ['pinMode(9, OUTPUT);', 'digitalWrite(9, HIGH);'],
            correct: 0,
            explanation: 'pinMode é usado para definir entradas e saídas.'
          }
        ]
      };
      currentSlideIdx = 0;
      document.getElementById('lesson-modal').classList.add('active');
      showSlide();
    }

    const badges = [
      { id: 'b1', icon: '🐣', name: 'Primeiro Passo', desc: 'Iniciou a jornada no ArduinoGo' },
      { id: 'b2', icon: '💡', name: 'Mestre dos LEDs', desc: 'Completou a lição de acender LEDs' },
      { id: 'b3', icon: '⚙️', name: 'Mestre dos Servos', desc: 'Aprendeu a mover Servo Motores' }
    ];

    function renderBadges() {
      const container = document.getElementById('badges-container');
      if (!container) return;
      container.innerHTML = '';
      badges.forEach(b => {
        const isUnlocked = state.unlockedBadges.includes(b.id) || state.completedLessons.length >= 2;
        const card = document.createElement('div');
        card.className = `badge-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="badge-icon">${b.icon}</div>
          <div class="badge-name">${b.name}</div>
          <div class="badge-desc">${b.desc}</div>
        `;
        container.appendChild(card);
      });
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.nav-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('view-path').classList.add('hidden');
      document.getElementById('view-infinite').classList.add('hidden');
      document.getElementById('view-badges').classList.add('hidden');

      document.getElementById(`view-${tabId}`).classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', updateUI);
    updateUI();
  </script>
</body>
</html>
